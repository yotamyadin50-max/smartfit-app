<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile viewport — essential for Capacitor/native feel -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />

    <!-- PWA / App Store meta -->
    <meta name="application-name" content="SmartFit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartFit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Description for stores -->
    <meta
      name="description"
      content="SmartFit — מאמן כושר ותזונה מבוסס AI. אימונים, תפריטים ומעקב התקדמות מותאמים אישית."
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>SmartFit - AI Fitness Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
